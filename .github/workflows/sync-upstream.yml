name: Sync Upstream Changes

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual one-click trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync with Upstream Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/rohitg00/ai-engineering-from-scratch.git
          git fetch upstream

      - name: Sync main branch
        run: |
          git checkout main
          git merge upstream/main --no-edit || git merge -X theirs upstream/main --no-edit
          git push origin main

      - name: Sync tags
        run: |
          git fetch upstream --tags
          git push origin --tags
